<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>will u b my valentine?</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
      --text: #333;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow-y: auto;
      padding: 16px;
      color: var(--text);
    }
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }
    .card {
      width: min(720px, 92vw);
      padding: 26px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
      transition: height 0.3s ease;
      margin: 20px 0;
    }
    .art {
      width: min(260px, 80vw);
      margin: 0 auto 10px;
      display: block;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
    }
    h1 {
      font-size: clamp(26px, 4vw, 44px);
      margin: 12px 0 18px;
    }
    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 150px;
      margin: 0 auto;
      touch-action: none;
    }
    button {
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, background .12s ease;
    }
    #yesBtn {
      position: absolute;
      top: 50%;
      left: 18%;
      transform: translateY(-50%);
      background: var(--yes);
      color: #fff;
    }
    #yesBtn:hover { background: var(--yesHover); }
    #noBtn {
      position: absolute;
      top: 50%;
      left: 62%;
      transform: translateY(-50%);
      background: #e5e7eb;
      color: #111827;
    }
    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }
    .question-phase {
      display: none;
      text-align: left;
      width: min(400px, 100%);
      margin: 0 auto;
      animation: pop .4s ease;
    }
    .question-phase h2 {
      text-align: center;
      margin-bottom: 10px;
      color: var(--yes);
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 2px solid #ffd6e7;
      border-radius: 12px;
      font-family: inherit;
      background: #fff;
      font-size: 16px;
    }
    select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ff3b7a%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 12px top 50%;
      background-size: 12px auto;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--yes);
    }
    .submit-btn {
      width: 100%;
      background: var(--yes);
      color: white;
      margin-top: 10px;
    }
    .result {
      display: none;
      margin-top: 18px;
      animation: pop .35s ease;
    }
    .result h2 {
      font-size: clamp(30px, 4.5vw, 46px);
      margin: 10px 0;
    }
    
    /* --- IMAGES & GIFS --- */
    .fireworks {
      width: min(380px, 90vw);
      margin: 0 auto 20px;
      display: block;
      border-radius: 12px;
    }
    
    /* Grid for the Cat Gifs */
    .cat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }
    .cat-grid img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      object-fit: cover;
    }

    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    
    <div id="step1">
      <svg class="art" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="fur" x1="0" x2="1"><stop offset="0" stop-color="#f7c7a1"/><stop offset="1" stop-color="#f2a97b"/></linearGradient>
          <linearGradient id="heart" x1="0" x2="1"><stop offset="0" stop-color="#ff4d7d"/><stop offset="1" stop-color="#ff1f68"/></linearGradient>
        </defs>
        <path d="M250 50 C250 33 270 25 282 38 C294 25 314 33 314 50 C314 78 282 92 282 106 C282 92 250 78 250 50Z" fill="url(#heart)"/>
        <path d="M90 120 C90 70 140 40 190 60 C240 40 290 70 290 120 C290 180 240 210 190 210 C140 210 90 180 90 120Z" fill="url(#fur)"/>
        <path d="M110 92 L95 55 L140 78 Z" fill="#f2a97b"/>
        <path d="M270 92 L285 55 L240 78 Z" fill="#f2a97b"/>
        <circle cx="160" cy="130" r="8"/>
        <circle cx="220" cy="130" r="8"/>
        <path d="M190 144 C186 144 182 148 182 152 C182 160 190 164 190 170 C190 164 198 160 198 152 C198 148 194 144 190 144Z" fill="#ff7aa2"/>
      </svg>
      <h1>meghna will you be my valentine?</h1>
      <section class="button-zone" id="zone">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
      </section>
      <div class="hint" id="hint">“No” seems a bit shy 😈</div>
    </div>

    <form id="step2" class="question-phase">
      <h2>Yay! Let's plan the date 🌏</h2>
      
      <img class="fireworks" src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif" alt="Fireworks" />
      
      <label for="date_pref">When do you want to do it?</label>
      <select name="date_pref" id="date_pref" required>
        <option value="" disabled selected>Select a time...</option>
        <option value="Feb 14 AM (Me) / Feb 14 PM (You)">Feb 14 Morning (Me) / Evening (You)</option>
        <option value="Feb 14 PM (Me) / Feb 15 AM (You)">Feb 14 Evening (Me) / Feb 15 Morning (You)</option>
      </select>

      <label for="food">Do we want to cook our meals?</label>
      <input type="text" name="food" id="food" placeholder="Yes! Brekkie for me, Dinner for you? Or the other way around..." required>

      <label for="activity">What do we want to do after?</label>
      <input type="text" name="activity" id="activity" placeholder="Painting? Movie? Games? Something else?" required>

      <label for="message">Anything else?</label>
      <textarea name="message" id="message" rows="3" placeholder="Tell me something sweet..."></textarea>

      <button type="submit" class="submit-btn">Send to Mr. pooker/ habibi/ saf-yum/ pookie singh 💌</button>
    </form>

    <section class="result" id="result">
      <h2>I CAN'T WAIT! 🎉</h2>
      
      <div class="cat-grid">
        <img src="https://media1.tenor.com/m/_hUq1BSUsiMAAAAC/cat-cute.gif" alt="Cute Cat">
        <img src="https://media1.tenor.com/m/ZjMt0YiJYWMAAAAC/dancing-cat-dance.gif" alt="Dancing Cat">
        <img src="https://media1.tenor.com/m/o_5RQarGvJ0AAAAd/kiss.gif" alt="Kissing Cat">
        <img src="https://i.pinimg.com/736x/03/68/0a/03680aba4f151b9244e15603b464e7fa.jpg" alt="Cat with Rose">
      </div>
      
    </section>
  </main>

  <script>
    /* =========================================================
       👇👇👇 REPLACE THIS WITH YOUR EMAIL ADDRESS! 👇👇👇
       ========================================================= */
    const YOUR_EMAIL = "satyam.priyadarshi@outlook.com"; 

    const step1 = document.getElementById("step1");
    const step2 = document.getElementById("step2");
    const step3 = document.getElementById("result");
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    /* CONFETTI SETUP */
    const confettiCanvas = document.getElementById("confettiCanvas");
    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }
    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    const confettiInstance = confetti.create(confettiCanvas, { resize: false, useWorker: true });

    function fullScreenConfetti() {
      const end = Date.now() + 1600;
      (function frame() {
        confettiInstance({ particleCount: 12, spread: 90, startVelocity: 45, ticks: 180, origin: { x: Math.random(), y: Math.random() * 0.3 } });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
      setTimeout(() => {
        confettiInstance({ particleCount: 300, spread: 140, startVelocity: 60, ticks: 220, origin: { x: 0.5, y: 0.55 } });
      }, 300);
    }

    /* BUTTON LOGIC */
    let yesScale = 1;
    function growYes() {
      yesScale = Math.min(2.2, yesScale + 0.1);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    function moveNo(px, py) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      let dx = (b.left + b.width/2) - px;
      let dy = (b.top + b.height/2) - py;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag; dy /= mag;
      let newLeft = Math.max(0, Math.min(z.width - b.width, (b.left - z.left) + dx * 150));
      let newTop  = Math.max(0, Math.min(z.height - b.height, (b.top - z.top) + dy * 150));
      noBtn.style.left = newLeft + "px";
      noBtn.style.top = newTop + "px";
      noBtn.style.transform = "none";
      growYes();
    }

    zone.addEventListener("pointermove", e => {
      const b = noBtn.getBoundingClientRect();
      if (Math.hypot((b.left + b.width/2) - e.clientX, (b.top + b.height/2) - e.clientY) < 140) moveNo(e.clientX, e.clientY);
    });
    noBtn.addEventListener("click", e => e.preventDefault());

    yesBtn.addEventListener("click", () => {
      step1.style.display = "none";
      step2.style.display = "block";
      confettiInstance({ particleCount: 50, spread: 70, origin: { y: 0.7 }});
    });

    /* FORM SUBMISSION */
    step2.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const formData = new FormData(step2);
      const data = Object.fromEntries(formData.entries());

      // Show result immediately (optimistic UI)
      step2.style.display = "none";
      step3.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();

      // Send email quietly in background
      if(YOUR_EMAIL !== "PUT_YOUR_EMAIL_HERE") {
        try {
          await fetch(`https://formsubmit.co/ajax/${YOUR_EMAIL}`, {
            method: "POST",
            headers: { 
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify(data)
          });
        } catch (err) {
          console.error("Failed to send email", err);
        }
      } else {
        console.warn("Email not set in code!");
      }
    });
  </script>
</body>
</html>
